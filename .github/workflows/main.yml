name: Electron CI/CD

on:
  push:
    branches:
      - ${{ github.event.repository.default_branch }}  # dynamically uses the repo's default branch

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      # Checkout repository
      - name: Checkout code
        uses: actions/checkout@v4

      # Setup Node.js
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 18
          cache: 'npm'

      # Install dependencies
      - name: Install dependencies
        run: npm install

      # Lint (optional)
      - name: Run lint
        run: npm run lint

      # Build Vue frontend
      - name: Build Vue app
        run: npm run build

      # Build & Publish Electron app
      - name: Build & Publish Electron
        run: npm run electron:publish
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
